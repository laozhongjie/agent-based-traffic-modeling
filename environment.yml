# Shared Python environment. Create once from the repository root:
#   conda env create -f environment.yml
#   conda activate traffic
# SUMO itself is installed separately (see docs/guide.html).
name: traffic
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy=1.26
  - scipy=1.13
  - matplotlib=3.10
  - pandas=2.2              # tables; traffic_project.results.load_summary returns one
  - jupyterlab=4.4          # notebooks for exploring and plotting (sandbox/<your-name>/)
  - pytest=8.3             # automated checks of the shared code: run pytest from the repository root
  - pip
  - pip:
      - -e .
