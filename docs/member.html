  <header class="topbar">

    <section class="member-schedule" aria-labelledby="member-schedule-h">

      <p class="section-intro" id="member-schedule-note"></p>
      <ol class="phases" id="member-schedule"></ol>

  <footer class="footer">
    <div class="wrap footer-inner">
      <span data-i18n="footer.howto">To update progress, click tasks on your member page. To change the tasks themselves, edit <code>docs/data/project.js</code> and push.</span>

  <script defer src="assets/i18n.js"></script>
