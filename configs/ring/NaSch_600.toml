# Ring-road density sweep with NaSch Model.
# Run:  python scripts/ring_sweep.py --config configs/ring/NaSch_600.toml
# Plot: python scripts/plot_ring.py  --config configs/ring/NaSch_600.toml
# # Vehicles use lattice-aligned initial positions; dynamic randomness is controlled by sigma and seed.

name = "NaSch_600"
scenario = "ring"
model = "NaSch"

[ring]
length_m = 600 

[run]
end_s = 1800
step_s = 1.0
warmup_s = 600

[initial]
mode = "nasch_lattice"

[sweep]
# Corresponds to: 
# 10, 15, 20, 25, 30, 35, 40, 45, 50, 55, 60, 65 veh/km
vehicles = [6, 9, 12, 15, 18, 21, 24, 27, 30, 33, 36, 39]
seeds = [501, 502, 503]

[vtype]
carFollowModel = "NaSch"
length = 7.5
minGap = 0.0
accel = 7.5
decel = 30.0
emergencyDecel = 30.0
tau = 1.0

maxSpeed = 30.0
sigma = 0.2 # This is the random probability, fixed here first
speedDev = 0
speedFactor = 1

# Modified here
[measure]
jam_speed_mps = 15.0       
timeseries_every_s = 10   
