# Python/TraCI-controlled Bando OVM finite-size sweep on release SUMO.
# Run: python scripts/ring_sweep.py --config configs/ring/OVM_4800.toml

name = "OVM_4800"
scenario = "ring"
model = "OVM"
implementation = "traci"
variant = "traci-dt0p2"

[ring]
length_m = 4800

[run]
end_s = 1800
step_s = 0.2
warmup_s = 600
fcd_every_s = 1.0
fcd_begin_s = 0.0

[initial]
mode = "uniform_jitter"
jitter_m = 0.5

[sweep]
# For reproducibility to rerun entire pannel
vehicles = [48, 72, 96, 120, 144, 168, 192, 216, 240, 264, 288, 312]
seeds = [501] # One run should be find as patterns are almost similar

[vtype]
# SUMO insertion placeholder; Python/TraCI controls longitudinal speeds.
carFollowModel = "Krauss"
length = 5.0
minGap = 2.0
accel = 1.0
decel = 1.5
sigma = 0.0
tau = 1.0
maxSpeed = 30.0
speedDev = 0
speedFactor = 1

[ovm]
alpha = 1.0
h_c = 25.0
h_scale = 5.0

[measure]
jam_speed_mps = 15.0
timeseries_every_s = 10
