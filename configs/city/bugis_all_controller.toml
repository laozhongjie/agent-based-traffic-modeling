# Constant-density density sweep on the Bugis district (net "all") with task 4's controller
# (src/traffic_project/demand.py): N cars exactly, re-targeted so none arrives, live rerouting,
# teleport after 300 s. Replaces task 3's drifting runs (bugis_all_density_settled.toml).
# Provisional rulings of 2026-10-27, by C, awaiting the group:
#   T4-D1   new random destination near the route end, and as soon as a car is within 60 m
#           of its destination by road (guard_m); every car re-plans every 60 s on travel
#           times averaged over 180 s (SUMO rerouting device)
#   T3-D11  option C: teleport a car stuck for 300 s; every run reports teleports per car-hour.
#           Teleport-off is still the team rule (GUIDE section 7); allow_teleport below needs
#           member A's approval of the runner change in a later PR. Columns
#           city_teleports_per_car_h_window (warmup_s-end_s, the number to quote) and
#           city_teleports_per_car_h_run (0-end_s, includes the unsettled first hour).
#   T3-D9   (trial) 7,200 s runs measured over 3,600-7,200 s; settledness check on flow
# Every number is provisional pending T3-D1, T3-D2, T3-D6, T3-D8 (criterion) and T1-D9, T1-D13
# (network freeze; T1-D1, T1-D4, T1-D7 agreed by the group 2026-10-22).
# Run and measure: python scripts/city_sweep.py --config configs/city/bugis_all_controller.toml
# (a smoke run with shorter settings needs its own --prefix and --name; see the script)
# Run folders runs/ctl_city_bugis_all_k<k>_s<seed>/ are git-ignored.
name = "bugis_all_controller"
scenario = "city"
model = "IDM"

[network]
net_file = "scenarios/city/bugis_all.net.xml"   # Task 1 main net (all road classes), v1 frozen 2026-10-29 (373a24c)
tag = "bugis_all"
# baseline_net_file = "scenarios/city/bugis_all.net.xml"   # planning variants only (T4-D2), in a copy with its own name and run_prefix:
# variant = "closure_<road>"                                # N and destinations from the baseline, net_file = the variant; see scripts/city_sweep.py

[sweep]
densities_veh_km = [2.5, 5, 7.5, 10, 12.5, 15, 20, 25, 30, 35, 40]   # 35 added 2026-10-29 (Q18, frozen net); veh/km: N / total lane length of normal lanes (task 3 settled sweep)
seeds = [1, 2, 3]
jobs = 8                       # parallel worker processes, one SUMO run each (CPU cores)
run_prefix = "ctl_city_bugis_all"   # run IDs <run_prefix>_k<k>_s<seed>

[run]
end_s = 7200                   # s, run length (T3-D9 trial)
warmup_s = 3600                # s, measurements use warmup_s-end_s (T3-D9 trial); also the v_ref window start of the reference run
step_length_s = 1              # s
allow_teleport = true          # T3-D11 option C: report teleports instead of failing the no_teleport check
time_to_teleport_s = 300       # s a car may stand still before SUMO teleports it (SUMO's default); -1 when allow_teleport = false
placement_jitter_m = 0.5       # m; cars spread evenly over all car lanes at t = 0, +- this jitter (as task 3)
# queue_output_s = 90          # s; uncomment to also write SUMO's aggregated queue-output (per-cycle maximum queue per edge) to queue<s>.xml.gz; scripts/city_measures.py needs it equal to the 90 s signal cycle

[controller]   # T4-D1, src/traffic_project/demand.py
retarget_at_remaining_edges = 3  # edges: new random destination when a car is this close to its route end (as task 3)
destination = "uniform_edge"   # destination edge drawn uniformly from the edges that allow passenger cars
guard_m = 60                   # m: re-target when the current edge ends less than this before the destination by any path, and never draw a destination that close; must exceed maxSpeed x step_length_s (30 m), checked by the script
seed_offset = 7919             # destination draws use the seed seed + seed_offset (as task 3's pilot)

[rerouting]   # SUMO rerouting device (T4-D1); the setting of C's gridlock diagnosis (not in the repo) that kept flow up without gridlock
probability = 1                # share of cars with the device
period_s = 60                  # s between re-plans of each car
adaptation_interval_s = 10     # s between travel-time samples
adaptation_steps = 18          # samples averaged: 18 x 10 s = 180 s

[settle]   # T3-D9 trial settledness check
block_s = 1800                 # s, block length for flow and teleport rates per block
ratio_min = 0.9                # flow(last block) / flow(previous block) must be >= this
ratio_max = 1.1                # ... and <= this
in_valid = false               # true: an unsettled run is invalid; false: reported in city_settled only

[vehicle]   # written unchanged into the SUMO <vType>; = the Task 3 grid pilot vType (configs/validation/grid_smoke.toml on main)
carFollowModel = "IDM"
length = 5                     # m
minGap = 2                     # m, IDM s0
accel = 1.0                    # m/s^2, IDM a
decel = 1.5                    # m/s^2, IDM b (comfortable deceleration)
tau = 1.5                      # s, IDM time headway T
delta = 4                      # IDM acceleration exponent (no unit)
maxSpeed = 30                  # m/s, IDM v0; lane speed limits cap it (at most 19.44 m/s in this net)
speedDev = 0                   # (ratio, no unit) all cars share the same desired speed
speedFactor = 1                # (ratio, no unit) desired speed = speedFactor x lane speed limit

[inputs]
edgedata_file = "edge{period:g}.xml.gz"   # edgeData at the criterion period (90 s cycle)
summary_file = "summary.xml"
write_timeseries = true

[measure]   # same values as configs/city/bugis_all_density_settled.toml
timeseries_every_s = 10    # s
r_on = 0.5                 # T3-D1, (ratio, no unit) speed / v_ref below which an edge counts as congested
persist_m = 2              # T3-D1, intervals
period_s = "cycle"         # T3-D1; 90 s in Bugis (all 76 signals), T1-D4
period_mult = 1            # T3-D1, (ratio, no unit) measurement interval = period_mult x period_s
adjacency = "directed"     # T3-D1
weight = "lane_length"     # T3-D2
reference_density_veh_km = 2   # veh/km, free-flow reference run (T3-D8 option A), same controller settings and end_s
reference_seed = 99
vref_min_sampled_s = 60    # s; T3-D8 default
vref_coverage_min = 0.90   # (share, no unit) v_ref coverage must exceed this (proposal section 4); reported in city_vref_coverage_ok, not a validity check
vref_fallback = "class_median"  # T3-D8
spillback_occ_frac = 0.8   # T3-D8
veh_length_m = 5.0         # m
min_gap_m = 2.0            # m
gridlock_outflow_frac = 0.01   # T3-D8
gridlock_cycles = 3        # T3-D8, intervals
# MFD measures, queues and betweenness against congestion onset: read by scripts/city_measures.py, not by the sweep
onset_share = 0.5          # (share, no unit) an edge's onset density is the first swept density at which it is congested in more than this share of the measured cycles (seed mean)
onset_share_checks = [0.25, 0.75]   # (shares, no unit) the same onset density at these shares, as a sensitivity check
onset_censor_factor = 1.25 # (ratio, no unit) edges never congested in the sweep rank at this x the highest swept density
flow_plateau_veh_km = [20, 35]   # veh/km, the flat top of the flow curve, shaded in the figures
heatmap_density_veh_km = 30      # veh/km, the queue heat map shows the seed 1 run at this density
